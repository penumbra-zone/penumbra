[package]
name = "penumbra-sdk-proto"
authors = {workspace = true}
repository = {workspace = true}
description = "Bindings and extension traits for Penumbra protobufs"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[build-dependencies]
anyhow = "1"

[features]
rpc = ["dep:tonic", "ibc-proto/client"]
box-grpc = ["dep:http-body", "dep:tonic", "dep:tower"]
cnidarium = ["dep:cnidarium", "dep:futures", "dep:pin-project"]
tendermint = [
    "dep:chrono",
    "dep:tendermint",
    "dep:tendermint-proto",
    "dep:tendermint-rpc",
    "dep:thiserror",
    "dep:tonic",
]
ibc = ["dep:ibc-types"]

[dependencies]
anyhow = {workspace = true, default-features = false}
async-trait = {workspace = true, default-features = false}
bech32 = {workspace = true, default-features = false}
bytes = {workspace = true, features = ["serde"], default-features = false}
chrono = {workspace = true, optional = true, default-features = false, features = ["serde"]}
cnidarium = {workspace = true, optional = true, default-features = true}
decaf377-fmd = {workspace = true, default-features = false}
decaf377-rdsa = {workspace = true, default-features = false}
futures = {workspace = true, optional = true}
http-body = {workspace = true, optional = true, default-features = false}
ibc-types = {workspace = true, optional = true, features = ["std"], default-features = true}
pbjson = {workspace = true, default-features = false}
pbjson-types = {workspace = true, default-features = false}
pin-project = {workspace = true, optional = true}
prost = {workspace = true, default-features = false}
serde = {workspace = true, features = ["derive"], default-features = false}
serde_json = {workspace = true, default-features = false}
subtle-encoding = "0.5"
tendermint = {workspace = true, optional = true}
tendermint-proto = {workspace = true, optional = true}
tendermint-rpc = {workspace = true, optional = true, features = ["http-client"]}
thiserror = {workspace = true, optional = true}
tonic = {workspace = true, optional = true}
tower = {workspace = true, features = ["full"], optional = true}
tracing = {workspace = true}

[dependencies.ibc-proto]
workspace = true
default-features = false
features = [
    "std",
    "serde",
]
