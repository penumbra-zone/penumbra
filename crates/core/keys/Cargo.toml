[package]
name = "penumbra-sdk-keys"
authors = {workspace = true}
repository = {workspace = true}
description = "Key data structures and core utilities for Penumbra"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
default = ["rand", "decaf377/arkworks"]
parallel = [
    "penumbra-tct/parallel",
    "ark-ff/parallel", 
    "poseidon377/parallel", 
    "decaf377-rdsa/parallel", 
    "ark-std/parallel", 
    "ark-r1cs-std/parallel",
    "decaf377/parallel",
    "penumbra-asset/parallel"
]
rand = [
    "rand_core", 
    "dep:rand", 
    "decaf377/rand", 
    "decaf377-fmd/rand", 
    "decaf377-ka/rand",
    "decaf377-rdsa/rand",
    "penumbra-asset/rand",
]

[dependencies]
aes = "0.8.1"
anyhow = {workspace = true}
