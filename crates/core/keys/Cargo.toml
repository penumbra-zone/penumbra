decaf377-fmd = {workspace = true}
decaf377-ka = {workspace = true}
decaf377-rdsa = {workspace = true, features = ["serde"]}
derivative = {workspace = true}
ethnum = {workspace = true}
f4jumble = "0.1.0"
hex = {workspace = true}
hmac = "0.12.0"
ibig = {workspace = true}
