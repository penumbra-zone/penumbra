[package]
name = "penumbra-sdk-shielded-pool"
authors = {workspace = true}
repository = {workspace = true}
description = "Multi-asset shielded pool implementation for Penumbra"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium-component",
    "cnidarium",
    "penumbra-sdk-proto/cnidarium",
    "penumbra-sdk-ibc/component",
    "penumbra-sdk-sct/component",
    "tonic",
    "ibc-proto/server",
    "ibc-proto/transport",
]
# proving-keys = ["penumbra-proof-params/proving-keys"]
default = ["std", "component", "rand", "decaf377/arkworks"]
std = ["ark-ff/std"]
parallel = [
    "penumbra-sdk-tct/parallel",
    "ark-ff/parallel",
    "poseidon377/parallel",
    "decaf377-rdsa/parallel",
    "ark-groth16/parallel",
    "ark-r1cs-std/parallel",
    "decaf377/parallel",
    "tonic",
]
docsrs = []
rand = [
    "rand_core",
    "dep:rand",
    "decaf377/rand",
    "decaf377-fmd/rand",
    "decaf377-ka/rand",
    "decaf377-rdsa/rand",
    "penumbra-asset/rand",
    "penumbra-num/rand",
    "penumbra-keys/rand",
    "penumbra-sct/rand",
    "penumbra-tct/rand",
    "penumbra-proof-params/rand",
]

[dependencies]
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
ark-groth16 = {workspace = true, default-features = false}
ark-r1cs-std = {workspace = true, default-features = false}
ark-relations = {workspace = true}
ark-serialize = {workspace = true}
ark-snark = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
blake2b_simd = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
decaf377 = {workspace = true, features = ["r1cs"], default-features = false}
decaf377-fmd = {workspace = true, default-features = false}
decaf377-ka = {workspace = true, default-features = false}
decaf377-rdsa = {workspace = true, default-features = false}
futures = {workspace = true}
hex = {workspace = true}
ibc-proto = {workspace = true, default-features = false}
ibc-types = {workspace = true, features = ["with_serde"], default-features = false}
im = {workspace = true}
metrics = {workspace = true}
once_cell = {workspace = true}
penumbra-asset = {workspace = true, default-features = false}
penumbra-ibc = {workspace = true, default-features = false}
penumbra-keys = {workspace = true, default-features = false}
penumbra-num = {workspace = true, default-features = false}
penumbra-proof-params = {workspace = true, default-features = false}
penumbra-proto = {workspace = true, default-features = false}
penumbra-sct = {workspace = true, default-features = false}
penumbra-tct = {workspace = true, default-features = false}
penumbra-txhash = {workspace = true, default-features = false}
poseidon377 = {workspace = true, features = ["r1cs"]}
poseidon377 = {workspace = true, features = ["r1cs"], default-features = false}
prost = {workspace = true}
rand = {workspace = true, optional = true}
rand_core = {workspace = true, features = ["getrandom"], optional = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
tap = {workspace = true}
tendermint = {workspace = true}
thiserror = {workspace = true}
tonic = {workspace = true, optional = true}
tracing = {workspace = true}

[dev-dependencies]
proptest = {workspace = true}
