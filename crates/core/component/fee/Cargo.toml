[package]
name = "penumbra-sdk-fee"
authors = {workspace = true}
repository = {workspace = true}
description = "Multidimensional fee implementation for Penumbra"
version = {workspace = true}
license = {workspace = true}
edition = {workspace = true}

[features]
component = [
    "cnidarium-component",
    "cnidarium",
    "penumbra-sdk-proto/cnidarium",
    "tonic",
    "penumbra-sdk-proto/rpc"
]
default = ["std", "component", "rand", "decaf377/arkworks"]
std = ["ark-ff/std"]
docsrs = []
rand = [
    "rand_core",
    "dep:rand",
    "decaf377/rand",
    "decaf377-rdsa/rand",
    "penumbra-asset/rand",
    "penumbra-num/rand",
]

[dependencies]
anyhow = {workspace = true}
ark-ff = {workspace = true, default-features = false}
async-trait = {workspace = true}
blake2b_simd = {workspace = true}
bytes = {workspace = true}
cnidarium = {workspace = true, optional = true, default-features = true}
cnidarium-component = {workspace = true, optional = true, default-features = true}
decaf377 = {workspace = true}
decaf377-rdsa = {workspace = true}
im = {workspace = true}
metrics = {workspace = true}
penumbra-asset = {workspace = true}
penumbra-num = {workspace = true}
penumbra-proto = {workspace = true}
rand = {workspace = true, optional = true}
rand_core = {workspace = true, features = ["getrandom"], optional = true}
serde = {workspace = true, features = ["derive"]}
tendermint = {workspace = true}
tonic = {workspace = true, optional = true}
tracing = {workspace = true}

[dev-dependencies]
getrandom = {workspace = true}
